[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "manuscript-desk"
version = "0.1.0"
description = "A self-hosted, multi-user dashboard for tracking journal manuscript submissions."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Manuscript Desk contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "aiofiles==23.2.1",
  "apscheduler==3.10.4",
  "argon2-cffi==23.1.0",
  "beautifulsoup4==4.12.2",
  "fastapi==0.104.1",
  "jinja2==3.1.2",
  "pydantic==2.5.0",
  "python-dotenv==1.0.0",
  "python-multipart==0.0.6",
  "requests==2.31.0",
  "selenium==4.15.2",
  "tzdata==2025.2",
  "uvicorn==0.24.0",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.7.10,<2",
  "build>=1.2.2,<2",
  "httpx==0.27.2",
  "mypy>=1.11,<2",
  "pip-audit>=2.7,<3",
  "pytest==8.3.5",
  "pytest-cov>=5,<7",
  "ruff>=0.11.8,<0.12",
]

[project.scripts]
manuscript-desk = "manuscript_desk.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manuscript_desk"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CHANGELOG.md",
  "/THIRD_PARTY_NOTICES.md",
  "/compose.example.yml",
  "/.env.example",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501", "E731", "F841"]

[tool.mypy]
python_version = "3.10"
packages = ["manuscript_desk"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests"]
